<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>OBSERVE</title>
<style>
@font-face{
  font-family:'Inter';
  src:url('Inter/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight:100 900;font-style:normal;
}
:root{
  --bg:#fff;--tx:#5a5a5a;--lbl:#b9b9b9;--muted:#8c8c8c;--green:#6e9161;
  --pi:rgba(82,78,78,0.17);
  --h:44px;--r:20px;--rv:3px;--pad:22px;--lc:55px;--gap:10px;
  --f:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:13px;font-weight:400;
  display:flex;justify-content:center;}

/* SCREENS */
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  background:var(--bg);opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
}
.screen.active{opacity:1;pointer-events:all;}

/* TOPBAR */
.topbar{
  width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;
  padding:var(--pad) var(--pad) 0;flex-shrink:0;
}
.logotype img{height:9px;display:block;}
.free-beta{font-size:11px;font-weight:400;color:var(--green);letter-spacing:.02em;}
.tagline{
  font-size:9px;font-weight:400;color:var(--lbl);text-align:center;
  letter-spacing:.07em;text-transform:uppercase;padding:16px var(--pad) var(--pad);flex-shrink:0;
}

/* ══ LANDING ══ */
#s-land{cursor:pointer;}
.land-center{flex:1;display:flex;align-items:center;justify-content:center;}
.land-bottom{flex:1;display:flex;align-items:center;justify-content:center;}
.land-eye{width:130px;height:130px;}
.land-eye svg{width:130px;height:130px;}
.iris-rect{transition:transform 90ms cubic-bezier(0.3,0,0.9,1);}
.land-logo{height:9px;opacity:0;animation:fadein 1s ease .8s forwards;}
@keyframes fadein{to{opacity:1}}

/* ══ UPLOAD ══ */
.upload-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.upload-bottom{flex:1;display:flex;align-items:center;justify-content:center;}
.upload-circle{
  position:relative;
  width:130px;height:130px;
  cursor:pointer;touch-action:manipulation;
}
.upload-round-img{width:100%;height:100%;display:block;}
.upload-eye-overlay{
  position:absolute;inset:0;pointer-events:none;
}
.upload-eye-overlay svg{width:100%;height:100%;}
@keyframes fadeOutEye{from{opacity:1}to{opacity:0}}
.upload-lbl{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:9px;font-weight:400;color:var(--lbl);letter-spacing:.07em;text-transform:uppercase;
  white-space:nowrap;
  opacity:0;transition:opacity .4s ease .4s;
}
.upload-circle.eye-gone .upload-lbl{opacity:1;}

/* ══ LOADING ══ */
.load-center{flex:1;display:flex;align-items:center;justify-content:center;}
.load-eye{width:130px;height:130px;animation:loadpulse 2s ease-in-out infinite;}
.load-eye svg{width:130px;height:130px;}
@keyframes loadpulse{0%,100%{opacity:.9}50%{opacity:.45}}

/* ══ TRIM ══ */
.trim-vid-wrap{
  width:100%;max-width:440px;padding:14px var(--pad) 0;
  flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;
}
.trim-vid-box{background:#000;border-radius:var(--rv);overflow:hidden;width:100%;}
#tv{width:100%;height:auto;display:block;max-height:calc(100svh - 200px);object-fit:contain;}
.trim-ctrl{
  width:100%;max-width:440px;padding:12px var(--pad) 0;
  display:flex;flex-direction:column;gap:8px;flex-shrink:0;
}

/* trim bar: semi-transparent pill track */
.tbar{
  position:relative;height:var(--h);border-radius:var(--r);
  background:var(--pi);cursor:pointer;user-select:none;touch-action:none;
}
/* white range fill inside bar */
.trange{
  position:absolute;top:0;height:100%;background:#fff;
  border-radius:var(--r);pointer-events:none;
}
/* dark dot thumbs */
.tthumb{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;background:#5a5a5a;
  cursor:ew-resize;z-index:2;touch-action:none;
}
.trim-row{display:flex;justify-content:space-between;align-items:center;}
.ttime{font-size:11px;font-weight:400;color:var(--lbl);}
.use-btn{
  height:var(--h);border-radius:var(--r);background:var(--pi);
  display:inline-flex;align-items:center;justify-content:center;padding:0 22px;
  font-size:11px;font-weight:400;color:var(--tx);letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;border:none;align-self:flex-end;touch-action:manipulation;
  transition:opacity .15s;font-family:var(--f);
}
.use-btn:active{opacity:.7;}

/* ══ STAGE ══ */
#s-stage{background:#E3E3E3;}
.stage-body{
  width:100%;max-width:440px;padding:12px var(--pad) 0;
  display:flex;flex-direction:column;gap:12px;flex:1;
}
.stage-main{display:flex;gap:var(--gap);align-items:stretch;}

/* left col */
.lcol{width:var(--lc);flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.slbl{font-size:9px;font-weight:400;color:var(--lbl);letter-spacing:.08em;text-transform:uppercase;}
.type-card{
  background:#fff;border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:0;
  flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06);
}
.type-sep{width:28px;height:1px;background:rgba(0,0,0,.07);margin:4px 0;}
.type-item{
  font-size:9px;font-weight:400;color:var(--lbl);cursor:pointer;
  padding:5px 0;touch-action:manipulation;transition:color .18s;letter-spacing:.05em;
  text-transform:uppercase;
}
.type-item.on{color:var(--tx);}

/* threshold vertical slider */
.thresh-wrap{flex:1;display:flex;flex-direction:column;gap:5px;min-height:50px;}
.thresh-lbl{font-size:9px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--lbl);}
.vtrack{
  flex:1;border-radius:var(--r);background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.06);
  position:relative;cursor:ns-resize;touch-action:none;min-height:40px;overflow:hidden;
}
.vfill{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.08);}
/* dark dot indicator */
.vdot{
  position:absolute;left:50%;width:8px;height:8px;border-radius:50%;
  background:#5a5a5a;pointer-events:none;
  transform:translate(-50%,-50%);
}

/* video col */
.vcol{flex:1;min-width:0;}
.vid-wrap{position:relative;background:#000;border-radius:var(--rv);overflow:hidden;}
#mc{display:block;width:100%;height:auto;}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.vid-add{
  position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.28);border:none;color:rgba(255,255,255,.7);
  font-size:16px;font-weight:200;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;transition:background .15s;font-family:var(--f);
}
.vid-add:active{background:rgba(0,0,0,.45);}
.play-dot{
  position:absolute;bottom:7px;left:7px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.25);border:none;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
}
.play-dot svg{width:8px;height:8px;}
.zdot{
  position:absolute;bottom:7px;right:7px;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.18);transition:background .4s;pointer-events:none;
}
.zdot.on{background:var(--green);}

/* LANDSCAPE OVERRIDES */
#s-stage.is-landscape .stage-main{flex-direction:column;}
#s-stage.is-landscape .lcol{width:100%;flex-direction:row;align-items:center;gap:var(--gap);}
#s-stage.is-landscape .type-card{flex-direction:row;padding:0 14px;height:var(--h);flex:1;}
#s-stage.is-landscape .type-sep{width:1px;height:18px;margin:0 8px;}
#s-stage.is-landscape .thresh-wrap{flex:1.6;flex-direction:row;align-items:center;gap:7px;min-height:0;}
#s-stage.is-landscape .thresh-lbl{white-space:nowrap;flex-shrink:0;}
#s-stage.is-landscape .vtrack{flex:1;min-height:0;height:var(--h);cursor:ew-resize;overflow:hidden;}
#s-stage.is-landscape .vfill{bottom:0;top:0;right:auto;width:0;height:100%;}
#s-stage.is-landscape .vdot{top:50%;bottom:auto;left:auto;}
#s-stage.is-landscape .vcol{width:100%;}

/* back button */
.back-btn{
  width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.06);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;flex-shrink:0;transition:opacity .15s;
}
.back-btn:active{opacity:.7;}

/* emoji area */
.emoji-area{display:flex;flex-direction:column;gap:8px;}
.emoji-row{display:flex;align-items:center;gap:var(--gap);}
.elbl{
  font-size:9px;font-weight:400;color:var(--lbl);text-transform:uppercase;
  letter-spacing:.07em;line-height:1.6;flex-shrink:0;width:var(--lc);
}
.etube-wrap{flex:1;overflow:hidden;}
.etube{
  height:var(--h);border-radius:var(--r);background:var(--pi);
  display:flex;align-items:center;gap:1px;padding:0 10px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-mask:linear-gradient(to right,black 80%,transparent 100%);
  mask:linear-gradient(to right,black 80%,transparent 100%);
}
.etube::-webkit-scrollbar{display:none;}
.ei{
  font-size:22px;cursor:pointer;padding:2px 4px;border-radius:8px;
  border:1.5px solid transparent;transition:border-color .15s,background .15s;
  line-height:1;flex-shrink:0;touch-action:manipulation;
}
.ei:active{transform:scale(.86);}
.ei.on{border-color:rgba(0,0,0,.12);background:rgba(255,255,255,.65);}
.ecustom-row{display:flex;align-items:center;gap:9px;padding-left:calc(var(--lc) + var(--gap));}
.ecustom{
  width:38px;height:34px;background:var(--pi);border:none;border-radius:var(--r);
  text-align:center;font-family:var(--f);font-size:16px;color:var(--tx);
}
.ecustom:focus{outline:none;}
.ecnt{font-size:10px;color:var(--lbl);}

/* text area */
.text-area{display:none;flex-direction:column;gap:9px;}
.text-area.show{display:flex;}
.tinput{
  height:var(--h);background:#fff;border-radius:var(--r);border:none;
  padding:0 18px;font-family:var(--f);font-size:15px;font-weight:400;color:var(--tx);
  text-align:center;width:100%;box-shadow:0 0 0 1px rgba(0,0,0,.06);
}
.tinput:focus{outline:none;}
.tmodes{display:flex;gap:var(--gap);}
.tmode{
  flex:1;height:36px;border-radius:var(--r);background:var(--pi);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:400;color:var(--lbl);cursor:pointer;
  letter-spacing:.07em;text-transform:uppercase;transition:background .18s,color .18s;
  touch-action:manipulation;
}
.tmode.on{background:#fff;color:var(--tx);}
.tsel{
  height:36px;border-radius:var(--r);border:none;background:var(--pi);
  padding:0 14px;font-family:var(--f);font-size:9px;font-weight:400;color:var(--muted);
  width:100%;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;
  -webkit-appearance:none;text-align:center;
}

/* render pills */
.render-area{display:flex;flex-direction:column;gap:8px;}
.render-lbl{font-size:9px;font-weight:400;color:var(--lbl);text-transform:uppercase;letter-spacing:.07em;}
.rrow{display:flex;gap:var(--gap);}
.rp{
  flex:1;height:var(--h);border-radius:var(--r);background:var(--pi);
  position:relative;overflow:hidden;cursor:pointer;
  transition:flex .32s cubic-bezier(.34,1.18,.64,1),background .22s,opacity .15s;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  min-width:0;display:flex;align-items:center;justify-content:center;
}
.rp:active{opacity:.75;}
.rp.on{flex:2.2;background:#fff;}
.rp.absorbed{
  flex:0!important;opacity:0;min-width:0;padding:0;overflow:hidden;pointer-events:none;
  transition:flex .32s cubic-bezier(.34,1.18,.64,1),opacity .2s;
}
.rp-lbl{
  font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx);position:relative;z-index:1;pointer-events:none;
}
.rpf{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .18s;border-radius:inherit;}
.rp.on .rpf{opacity:1;pointer-events:all;cursor:ew-resize;}
.rpf-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.07);transition:width .04s;}
.rpf-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.18);transition:left .04s;}

/* export */
.exp-row{display:flex;gap:var(--gap);align-items:center;}
.exp-btn{
  flex:1;height:var(--h);border-radius:var(--r);border:none;background:#fff;
  font-family:var(--f);font-size:10px;font-weight:400;color:var(--tx);
  cursor:pointer;letter-spacing:.07em;text-transform:uppercase;transition:opacity .18s;
  box-shadow:0 0 0 1px rgba(0,0,0,.06);
}
.exp-btn:active{opacity:.7;}
.exp-arr{
  width:var(--h);height:var(--h);border-radius:50%;flex-shrink:0;
  background:var(--pi);border:none;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--tx);cursor:pointer;touch-action:manipulation;
  transition:opacity .15s;font-family:var(--f);
}
.exp-arr:active{opacity:.7;}

/* modal */
.mbg{
  display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
}
.mbg.on{display:flex;}
.modal{
  background:#f0f0f0;border-radius:16px;padding:22px;
  width:min(300px,84vw);display:flex;flex-direction:column;gap:10px;
}
.modal-t{font-size:13px;font-weight:400;color:var(--tx);}
.modal-s{font-size:11px;color:var(--lbl);line-height:1.5;}
.modal-p{height:2px;background:rgba(0,0,0,.08);border-radius:1px;overflow:hidden;}
.modal-pb{height:100%;background:var(--tx);width:0%;transition:width .18s;}
.modal-cancel{
  height:36px;border-radius:var(--r);border:none;background:rgba(0,0,0,.07);
  font-family:var(--f);font-size:11px;color:var(--tx);cursor:pointer;
  align-self:flex-end;padding:0 18px;
}
</style>
</head>
<body>

<!-- ══ LANDING ══ -->
<div id="s-land" class="screen active">
  <div class="topbar" aria-hidden="true" style="visibility:hidden">
    <span class="logotype"><img src="observe_logo.svg" alt=""></span>
  </div>
  <div class="land-center">
    <div class="land-eye">
      <svg viewBox="0 0 792 793" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="784" height="785" rx="369" fill="#EBEBEB" stroke="#DCDCDC" stroke-width="8"/>
        <path d="M747 385.5C747 385.5 589.852 490 396 490C202.148 490 45 385.5 45 385.5C45 385.5 202.148 281 396 281C589.852 281 747 385.5 747 385.5Z" fill="white"/>
        <rect class="iris-rect" id="iris-land" x="340" y="328" width="113" height="115" rx="56.5" fill="#5A5A5A"/>
      </svg>
    </div>
  </div>
  <div class="land-bottom">
    <img class="land-logo" src="observe_logo.svg" alt="OBSERVE">
  </div>
</div>

<!-- ══ UPLOAD ══ -->
<div id="s-upload" class="screen">
  <div class="topbar">
    <span class="logotype"><img src="observe_logo.svg" alt="OBSERVE"></span>
    <span></span>
  </div>
  <div class="upload-center">
    <div class="upload-circle" id="uploadCircle">
      <img class="upload-round-img" src="round.svg" alt="">
      <div class="upload-eye-overlay" id="uploadEyeOverlay">
        <svg viewBox="0 0 792 793" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="784" height="785" rx="369" fill="#EBEBEB" stroke="#DCDCDC" stroke-width="8"/>
          <path d="M747 385.5C747 385.5 589.852 490 396 490C202.148 490 45 385.5 45 385.5C45 385.5 202.148 281 396 281C589.852 281 747 385.5 747 385.5Z" fill="white"/>
          <rect class="iris-rect" id="iris-upload" x="340" y="328" width="113" height="115" rx="56.5" fill="#5A5A5A"/>
        </svg>
      </div>
      <span class="upload-lbl">upload</span>
    </div>
  </div>
  <div class="upload-bottom">
    <span class="free-beta">FREE BETA</span>
  </div>
  <input type="file" id="fi" accept="video/*,.gif" hidden>
</div>

<!-- ══ LOADING ══ -->
<div id="s-load" class="screen">
  <div class="topbar">
    <span class="logotype"><img src="observe_logo.svg" alt="OBSERVE"></span>
    <span></span>
  </div>
  <div class="load-center">
    <div class="load-eye">
      <svg viewBox="0 0 792 793" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="784" height="785" rx="369" fill="#EBEBEB" stroke="#DCDCDC" stroke-width="8"/>
        <path d="M747 385.5C747 385.5 589.852 490 396 490C202.148 490 45 385.5 45 385.5C45 385.5 202.148 281 396 281C589.852 281 747 385.5 747 385.5Z" fill="white"/>
        <rect class="iris-rect" id="iris-load" x="340" y="328" width="113" height="115" rx="56.5" fill="#5A5A5A"/>
      </svg>
    </div>
  </div>
  <div class="tagline">Thinked by DD for you to pay (attention)</div>
</div>

<!-- ══ TRIM ══ -->
<div id="s-trim" class="screen">
  <div class="topbar">
    <button class="back-btn" id="trimBackBtn">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M6.5 1.5L2.5 5L6.5 8.5" stroke="#5a5a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="logotype"><img src="observe_logo.svg" alt="OBSERVE"></span>
    <span class="free-beta">FREE BETA</span>
  </div>
  <div class="trim-vid-wrap">
    <div class="trim-vid-box"><video id="tv" muted playsinline></video></div>
  </div>
  <div class="trim-ctrl">
    <div class="tbar" id="tbar">
      <div class="trange" id="trange"></div>
      <div class="tthumb" id="thl"></div>
      <div class="tthumb" id="thr"></div>
    </div>
    <div class="trim-row">
      <span class="ttime" id="tslbl">0s</span>
      <span class="ttime" id="tdlbl">0s</span>
      <span class="ttime" id="telbl">0s</span>
    </div>
    <div style="display:flex;justify-content:flex-end;">
      <button class="use-btn" id="tconfirmBtn">USE &nbsp;›</button>
    </div>
  </div>
  <div class="tagline">Thinked by DD for you to pay (attention)</div>
</div>

<!-- ══ STAGE ══ -->
<div id="s-stage" class="screen">
  <div class="topbar">
    <button class="back-btn" id="stageBackBtn">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M6.5 1.5L2.5 5L6.5 8.5" stroke="#5a5a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="logotype"><img src="observe_logo.svg" alt="OBSERVE"></span>
    <span class="free-beta">FREE BETA</span>
  </div>

  <div class="stage-body">
    <div class="stage-main">
      <!-- left col -->
      <div class="lcol">
        <div class="slbl">select</div>
        <div class="type-card" id="typeCard">
          <span class="type-item on" data-t="emoji">EMOJI</span>
          <div class="type-sep"></div>
          <span class="type-item" data-t="text">TEXT</span>
        </div>
        <div class="thresh-wrap">
          <div class="thresh-lbl">THRESH</div>
          <div class="vtrack" id="vtrack">
            <div class="vfill" id="vtrackFill"></div>
            <div class="vdot" id="vtrackDot"></div>
          </div>
        </div>
      </div>
      <!-- video col -->
      <div class="vcol">
        <div class="vid-wrap" id="vidWrap">
          <canvas id="mc"></canvas>
          <canvas id="ov"></canvas>
          <button class="vid-add" id="addVidBtn">+</button>
          <button class="play-dot" id="playBtn">
            <svg id="playIcon" viewBox="0 0 9 11" fill="rgba(255,255,255,.75)"><path d="M1 1L8 5.5L1 10V1Z"/></svg>

// ══ PILL FILLER ══
function normVal(ctrl){const c=CC[ctrl];return(RV[ctrl]-c.min)/(c.max-c.min);}

function pillLabel(ctrl){
  const v=RV[ctrl];
  if(ctrl==='opacity')return Math.round(v)+'%';
  if(ctrl==='cell')return v+'px';
  if(ctrl==='glow')return v>0?v:'GLOW';
  return v;
}
function updatePillLabel(){}
function updateAllPillLabels(){}

function updateFiller(ctrl){
  const n=normVal(ctrl);
  const fill=document.getElementById('rpf-fill-'+ctrl);
  const line=document.getElementById('rpf-line-'+ctrl);
  if(!fill)return;
  fill.style.width=(n*100)+'%';
  line.style.left=(n*100)+'%';
}

function activatePill(ctrl){
  const el=$('rp-'+ctrl);if(!el)return;
  const rowEl=el.closest('.rrow');
  if(activeCtrl){
    const prev=$('rp-'+activeCtrl);
    if(prev){
      prev.classList.remove('on');
      const prevLbl=prev.querySelector('.rp-lbl');
      if(prevLbl)prevLbl.textContent=prev.dataset.label||activeCtrl.toUpperCase();
    }
    if(activeRow)activeRow.querySelectorAll('.rp').forEach(c=>{c.classList.remove('absorbed');});
    if(activeCtrl===ctrl){activeCtrl=null;activeRow=null;return;}
  }
  activeCtrl=ctrl;activeRow=rowEl;
  el.classList.add('on');
  const lbl=el.querySelector('.rp-lbl');
  if(lbl)lbl.textContent=pillLabel(ctrl);
  const next=el.nextElementSibling,prev2=el.previousElementSibling;
  const absorb=next&&!next.style.visibility?next:prev2&&!prev2.style.visibility?prev2:null;
  if(absorb&&absorb.classList.contains('rp'))absorb.classList.add('absorbed');
  updateFiller(ctrl);
}

document.querySelectorAll('.rp[data-ctrl]').forEach(pill=>{
  const ctrl=pill.dataset.ctrl;
  const filler=document.createElement('div');
  filler.className='rpf';
  filler.innerHTML=`<div class="rpf-fill" id="rpf-fill-${ctrl}"></div><div class="rpf-line" id="rpf-line-${ctrl}"></div>`;
  pill.appendChild(filler);
  pill.addEventListener('pointerdown',e=>{
    if(e.target===filler||filler.contains(e.target))return;
    activatePill(ctrl);
  });
  let drag=false;
  filler.addEventListener('pointerdown',e=>{
    if(!pill.classList.contains('on'))return;
    drag=true;filler.setPointerCapture(e.pointerId);applyDrag(e);e.stopPropagation();
  });
  filler.addEventListener('pointermove',e=>{if(!drag)return;applyDrag(e);});
  filler.addEventListener('pointerup',()=>drag=false);
  filler.addEventListener('pointercancel',()=>drag=false);
  function applyDrag(e){
    const r=pill.getBoundingClientRect();
    const n=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const c=CC[ctrl];
    RV[ctrl]=Math.round((c.min+n*(c.max-c.min))/c.step)*c.step;
    updateFiller(ctrl);
    const lbl=pill.querySelector('.rp-lbl');
    if(lbl&&pill.classList.contains('on'))lbl.textContent=pillLabel(ctrl);
  }
});

document.addEventListener('pointerdown',e=>{

// ══ THRESHOLD ══
function isLand(){return sStage.classList.contains('is-landscape');}

function updateThresh(v){

  if(isLand()){
    vtrackFill.style.width=(pct*100)+'%';
    vtrackFill.style.height='100%';

    // dot at right edge of fill
    vtrackDot.style.left='calc('+Math.min(pct*100,96)+'% - 4px)';
    vtrackDot.style.top='50%';
    vtrackDot.style.bottom='auto';
    vtrackDot.style.transform='translateY(-50%)';
  } else {
    vtrackFill.style.height=(pct*100)+'%';
    vtrackFill.style.width='';
    // dot at top edge of fill
    vtrackDot.style.bottom='calc('+Math.min(pct*100,96)+'% - 4px)';
    vtrackDot.style.top='auto';
    vtrackDot.style.left='50%';
    vtrackDot.style.transform='translateX(-50%)';
  }
  if(cvReady)initMOG2();
}

let vDrag=false;
function threshFromEvent(e){

}
vtrack.addEventListener('pointerdown',e=>{vDrag=true;vtrack.setPointerCapture(e.pointerId);threshFromEvent(e);});

// ══ OPENCV ══
function loadCV(cb){
  let ui=0;
  function tryLoad(){
    const s=document.createElement('script');s.async=true;
    s.onload=()=>{
      function w(n){
        if(typeof cv!=='undefined'&&cv instanceof Promise){cv.then(r=>{window.cv=r;done();}).catch(fail);return;}
        if(typeof cv!=='undefined'&&cv.Mat){done();return;}
        if(n>130)return fail();
        setTimeout(()=>w(n+1),100);
      }w(0);
    };
    s.onerror=fail;s.src=CV_URLS[ui++];document.head.appendChild(s);
  }
  function fail(){if(ui<CV_URLS.length)tryLoad();}
  function done(){cvReady=true;cb();}
  tryLoad();
}
function sensToP(s){const t=s/100;return{h:Math.round(220-t*190),v:Math.round(50-t*40),a:0.038-t*0.035};}
function initMOG2(){
  if(mogSub){mogSub.delete();mogSub=null;}
  const p=sensToP(sensVal);
  mogSub=new cv.BackgroundSubtractorMOG2(p.h,p.v,false);
  frameCount=0;motMask=null;
}
function processMOG2(W,H){
  if(!cvReady||!mogSub)return;
  const sc=1/3,mW=Math.round(W*sc),mH=Math.round(H*sc);
  mogCvs.width=mW;mogCvs.height=mH;mogCtx.drawImage(mediaEl,0,0,mW,mH);
  let src=null,fg=null,k=null,d=null;
  try{
    src=cv.imread(mogCvs);fg=new cv.Mat();mogSub.apply(src,fg);
    k=cv.getStructuringElement(cv.MORPH_ELLIPSE,new cv.Size(5,5));d=new cv.Mat();
    cv.morphologyEx(fg,d,cv.MORPH_OPEN,k);cv.dilate(d,d,k);
    const lb=new cv.Mat(),st=new cv.Mat(),ce=new cv.Mat();
    const nL=cv.connectedComponentsWithStats(d,lb,st,ce);
    const pa=sensToP(sensVal),minA=pa.a*mW*mH,tot=mW*mH;
    let bl=[];for(let i=1;i<nL;i++){const a=st.intAt(i,cv.CC_STAT_AREA);if(a>=minA&&a/tot<0.75)bl.push({i,a});}
    bl.sort((a,b)=>b.a-a.a);const top=bl.slice(0,6);
    const sm=new Uint8Array(mW*mH);
    if(top.length){const ld=lb.data32S;const bs=new Set(top.map(b=>b.i));for(let i=0;i<mW*mH;i++)sm[i]=bs.has(ld[i])?1:0;}
    if(!motMask||motMask.length!==W*H)motMask=new Uint8Array(W*H);
    for(let py=0;py<H;py++)for(let px=0;px<W;px++)motMask[py*W+px]=sm[Math.min(Math.floor(py*sc),mH-1)*mW+Math.min(Math.floor(px*sc),mW-1)];
    frameCount++;
    zdot.className=top.length&&frameCount>=15?'zdot on':'zdot';
    lb.delete();st.delete();ce.delete();
  }catch(e){console.error(e);}
  finally{if(src)src.delete();if(fg)fg.delete();if(k)k.delete();if(d)d.delete();}
}

// ══ TRIM ══
const TINSET=16; // px inset from bar edges so thumbs aren't glued to border
function openTrim(file){
  if(trimFileURL)URL.revokeObjectURL(trimFileURL);
  trimFileURL=URL.createObjectURL(file);
  tv.src=trimFileURL;tv.load();
  tv.onloadedmetadata=()=>{
    vidDur=tv.duration;trimStart=0;trimEnd=vidDur;
    showScreen('s-trim');
    tv.currentTime=0;tv.play().catch(()=>{});
    updateTrim();
  };
}
function updateTrim(){
  const W=tbar.clientWidth||360;
  const EW=W-2*TINSET;
  const lp=trimStart/vidDur,rp=trimEnd/vidDur;
  trange.style.left=(TINSET+lp*EW)+'px';
  trange.style.width=((rp-lp)*EW)+'px';
  thl.style.left=(TINSET+lp*EW)+'px';
  thr.style.left=(TINSET+rp*EW-4)+'px';
  tslbl.textContent=trimStart.toFixed(1)+'s';
  telbl.textContent=trimEnd.toFixed(1)+'s';
  tdlbl.textContent=(trimEnd-trimStart).toFixed(1)+'s';
}
function trimPM(cx){
  if(!trimDrag)return;
  const r=tbar.getBoundingClientRect();
  const EW=r.width-2*TINSET;
  const pct=Math.max(0,Math.min(1,(cx-r.left-TINSET)/EW));
  const t=pct*vidDur;
  if(trimDrag==='L')trimStart=Math.max(0,Math.min(t,trimEnd-.5));
  else trimEnd=Math.min(vidDur,Math.max(t,trimStart+.5));
  updateTrim();
}
thl.addEventListener('pointerdown',e=>{trimDrag='L';thl.setPointerCapture(e.pointerId);e.preventDefault();});
thr.addEventListener('pointerdown',e=>{trimDrag='R';thr.setPointerCapture(e.pointerId);e.preventDefault();});
thl.addEventListener('pointermove',e=>{if(trimDrag==='L')trimPM(e.clientX);});
thr.addEventListener('pointermove',e=>{if(trimDrag==='R')trimPM(e.clientX);});
thl.addEventListener('pointerup',()=>trimDrag=null);
thr.addEventListener('pointerup',()=>trimDrag=null);
tbar.addEventListener('click',e=>{
  if(trimDrag)return;
  const r=tbar.getBoundingClientRect();
  const EW=r.width-2*TINSET;
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left-TINSET)/EW));
  const t=pct*vidDur;
  if(Math.abs(t-trimStart)<Math.abs(t-trimEnd))trimStart=Math.max(0,Math.min(t,trimEnd-.5));
  else trimEnd=Math.min(vidDur,Math.max(t,trimStart+.5));
  updateTrim();
});

$('tconfirmBtn').addEventListener('click',()=>{

  inStage=true;

  } else {

  }
});

function loadClip(){
  if(raf)cancelAnimationFrame(raf);
  prevPx=null;trailBuf=null;motMask=null;frameCount=0;playing=true;
  const vid=document.createElement('video');
  vid.muted=true;vid.playsInline=true;vid.loop=false;
  vid.src=trimFileURL;
  vid.onloadedmetadata=()=>{
    mediaEl=vid;vid.currentTime=trimStart;
    vid.ontimeupdate=()=>{if(vid.currentTime>=trimEnd-.05)vid.currentTime=trimStart;};
    vid.addEventListener('ended',()=>{vid.currentTime=trimStart;vid.play().catch(()=>{});});
    vid.play().catch(()=>{});
    setPlayState(true);
    const landscape=vid.videoWidth>vid.videoHeight;
    sStage.classList.toggle('is-landscape',landscape);
    vtrack.style.cursor=landscape?'ew-resize':'ns-resize';
    updateThresh(sensVal);
    srcW=vid.videoWidth;srcH=vid.videoHeight;
    const vw=vidWrap.clientWidth||300;
    const s=Math.min(vw/vid.videoWidth,0.5);
    mc.width=Math.round(vid.videoWidth*s);
    mc.height=Math.round(vid.videoHeight*s);
    ov.width=mc.width;ov.height=mc.height;
    recCvs.width=srcW;recCvs.height=srcH;
    updateAllPillLabels();
    startRender();
  };
  vid.load();
}

// ══ PLAY/PAUSE ══
function setPlayState(p){
  playIcon.style.display=p?'none':'block';
  pauseIcon.style.display=p?'block':'none';
}
playBtn.addEventListener('click',()=>{
  if(!mediaEl)return;
  if(playing){mediaEl.pause();playing=false;setPlayState(false);}
  else{mediaEl.play().catch(()=>{});playing=true;setPlayState(true);}
});

// ══ RENDER ══
function sobel(px,W,H){
  const e=new Float32Array(W*H),a=new Float32Array(W*H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const g=(dx,dy)=>{const i=((y+dy)*W+(x+dx))*4;return px[i]*.299+px[i+1]*.587+px[i+2]*.114;};
    const tl=g(-1,-1),tc=g(0,-1),tr=g(1,-1),ml=g(-1,0),mr=g(1,0),bl=g(-1,1),bc=g(0,1),br=g(1,1);
    const gx=-tl-2*ml-bl+tr+2*mr+br,gy=-tl-2*tc-tr+bl+2*bc+br;
    const i=y*W+x;e[i]=Math.sqrt(gx*gx+gy*gy);a[i]=Math.atan2(gy,gx);
  }return{e,a};
}
function diffF(c,p,W,H){
  const d=new Float32Array(W*H);
  for(let i=0;i<W*H;i++){const j=i*4;d[i]=(Math.abs(c[j]-p[j])+Math.abs(c[j+1]-p[j+1])+Math.abs(c[j+2]-p[j+2]))/3;}
  return d;
}

function startRender(){
  if(raf)cancelAnimationFrame(raf);
  let mogC=0;
  function render(){
    const src=mediaEl;
    if(!src||src.paused||src.readyState<2){raf=requestAnimationFrame(render);return;}
    const W=mc.width,H=mc.height;_W=W;_H=H;
    off.width=W;off.height=H;offCtx.drawImage(src,0,0,W,H);
    const id=offCtx.getImageData(0,0,W,H);const px=id.data;_px=id;
    ctx.globalAlpha=VIDEO_DEF/100;ctx.globalCompositeOperation='source-over';ctx.drawImage(src,0,0,W,H);ctx.globalAlpha=1;
    mogC++;if(mogC%2===0)processMOG2(W,H);
    drawOverlay(W,H);
    const mf=prevPx&&prevPx.length===px.length?diffF(px,prevPx,W,H):null;
    prevPx=new Uint8ClampedArray(px);
    if(!trailBuf||trailBuf.length!==W*H)trailBuf=new Float32Array(W*H);
    const dc=TRAIL_DEF/100;if(mf)for(let i=0;i<W*H;i++)trailBuf[i]=trailBuf[i]*dc+mf[i]*(1-dc);
    if(!motMask||frameCount<8){raf=requestAnimationFrame(render);return;}
    const{e,a}=sobel(px,W,H);_edge=e;_angle=a;
    drawASCII(ctx,W,H,W,H,px,e,a,RV.cell);
    raf=requestAnimationFrame(render);
  }
  raf=requestAnimationFrame(render);
}

function drawOverlay(W,H){
  ovCtx.clearRect(0,0,W,H);if(!motMask)return;
  const id=ovCtx.createImageData(W,H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;if(!motMask[i])continue;
    if(!motMask[(y-1)*W+x]||!motMask[(y+1)*W+x]||!motMask[y*W+x-1]||!motMask[y*W+x+1]){
      const p=i*4;id.data[p]=110;id.data[p+1]=145;id.data[p+2]=100;id.data[p+3]=140;
    }
  }
  ovCtx.putImageData(id,0,0);
}

function drawASCII(tC,tW,tH,mW,mH,px,edge,angle,CELL){
  if(!motMask)return;
  const sX=tW/mW,sY=tH/mH,dC=Math.round(CELL*sX),dF=Math.max(dC-2,5);
  const op=RV.opacity/100,eTh=EDGE_DEF,mTh=RV.motion,gR=RV.glow;
  tC.textBaseline='top';tC.globalCompositeOperation='source-over';
  let lc=0,ec=0;
  for(let cy=0;cy<Math.ceil(mH/CELL);cy++)for(let cx2=0;cx2<Math.ceil(mW/CELL);cx2++){
    const px0=cx2*CELL,py0=cy*CELL;
    const ccx=Math.min(Math.round(px0+CELL/2),mW-1),ccy=Math.min(Math.round(py0+CELL/2),mH-1);
    if(!motMask[ccy*mW+ccx])continue;
    let mE=0,bA=0,mM=0,sr=0,sg=0,sb=0,cnt=0;
    for(let dy=0;dy<CELL&&py0+dy<mH;dy++)for(let dx=0;dx<CELL&&px0+dx<mW;dx++){
      const i=(py0+dy)*mW+(px0+dx);
      if(edge[i]>mE){mE=edge[i];bA=angle[i];}
      if(trailBuf[i]>mM)mM=trailBuf[i];
      const pi=i*4;sr+=px[pi];sg+=px[pi+1];sb+=px[pi+2];cnt++;
    }
    const hE=mE>eTh,hM=mM>mTh;if(!hE&&!hM)continue;
    const iM=hM&&mM>mE*.3;
    const col=iM?zone.motColor:zone.edgeColor;
    let ch,ff=`${dF}px 'Courier New',monospace`;
    if(zone.gfxType==='emoji'){
      const em=zone.emojis.length?zone.emojis:['●'];ch=em[ec%em.length];ec++;ff=`${dF+2}px serif`;
    } else {
      const w=zone.wordText||'FLOW';
      switch(zone.wordMode){case 'whole':ch=w;break;case 'cycle':ch=w[lc++%w.length];break;default:ch=w[Math.floor(Math.random()*w.length)];}
      ff=`bold ${Math.max(dF-2,4)}px ${zone.wordFont}`;
    }
    const dx=Math.round(px0*sX),dy=Math.round(py0*sY);
    tC.font=ff;tC.globalAlpha=op;
    if(gR>0){tC.shadowColor=col;tC.shadowBlur=gR*2*sX;}else tC.shadowBlur=0;
    tC.fillStyle=col;tC.fillText(ch,dx,dy);
  }
  tC.globalAlpha=1;tC.globalCompositeOperation='source-over';tC.shadowBlur=0;
}

// ══ EXPORT ══
function buildRecFrame(){
  if(!mediaEl||!srcW||!srcH)return;
  const W=srcW,H=srcH;
  recCtx.globalAlpha=VIDEO_DEF/100;recCtx.globalCompositeOperation='source-over';
  recCtx.drawImage(mediaEl,0,0,W,H);recCtx.globalAlpha=1;
  if(_edge&&_angle&&_px&&motMask&&frameCount>=8)
    drawASCII(recCtx,W,H,_W,_H,_px.data,_edge,_angle,RV.cell);
}
async function exportClip(){
  if(!mediaEl||!srcW||!srcH)return;
  const clipMs=(trimEnd-trimStart)*1000;
  if(clipMs<=200)return;
  showModal('Exporting…','');expCancelled=false;
  const savedHandler=mediaEl.ontimeupdate;
  mediaEl.ontimeupdate=null;
  mediaEl.currentTime=trimStart;
  await new Promise(r=>{const h=()=>{mediaEl.removeEventListener('seeked',h);r();};mediaEl.addEventListener('seeked',h);setTimeout(r,800);});
  if(expCancelled){mediaEl.ontimeupdate=savedHandler;hideModal();return;}
  mediaEl.play().catch(()=>{});
  recCvs.width=srcW;recCvs.height=srcH;
  const recChunks=[];
  buildRecFrame();
  const stream=recCvs.captureStream(FPS);
  const mp4Mimes=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4'];
  const webmMimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  let mime=null,ext='webm';
  for(const m of mp4Mimes){if(MediaRecorder.isTypeSupported(m)){mime=m;ext='mp4';break;}}
  if(!mime){for(const m of webmMimes){if(MediaRecorder.isTypeSupported(m)){mime=m;ext='webm';break;}}}
  let rec;
  try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000});}
  catch(e){try{rec=new MediaRecorder(stream,{videoBitsPerSecond:12000000});}catch(e2){rec=new MediaRecorder(stream);}}
  rec.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data);};
  rec.onstop=()=>{
    mediaEl.ontimeupdate=savedHandler;
    mediaEl.currentTime=trimStart;mediaEl.play().catch(()=>{});
    hideModal();
    if(!expCancelled&&recChunks.length>0)
      dlBlob(new Blob(recChunks,{type:mime||'video/webm'}),'observe-'+Date.now()+'.'+ext);
  };
  rec.start(50);
  let elapsed=0;
  mSub.textContent='Exporting '+Math.round(clipMs/1000)+'s…';
  const iv=setInterval(()=>{
    if(expCancelled){clearInterval(iv);rec.stop();return;}
    elapsed+=FMS;
    mBar.style.width=Math.min(elapsed/clipMs*100,100)+'%';
    buildRecFrame();
    if(elapsed>=clipMs){clearInterval(iv);rec.stop();}
  },FMS);
}
expBtn.addEventListener('click',exportClip);
expArr.addEventListener('click',exportClip);

// ══ UTILS ══
function showModal(t,s){mTitle.textContent=t;mSub.textContent=s;mBar.style.width='0%';expModal.classList.add('on');}
function hideModal(){expModal.classList.remove('on');}
mCancelBtn.addEventListener('click',()=>{expCancelled=true;hideModal();});
function dlBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();}

function resetApp(){
  if(raf)cancelAnimationFrame(raf);
  if(mediaEl){mediaEl.pause();mediaEl.src='';mediaEl.ontimeupdate=null;}
  if(mogSub){try{mogSub.delete();}catch(e){}mogSub=null;}
  mediaEl=null;prevPx=null;trailBuf=null;motMask=null;frameCount=0;playing=false;
  inStage=false;cvReady=false;
  zdot.className='zdot';
  ovCtx.clearRect(0,0,ov.width||1,ov.height||1);
  setPlayState(false);
  if(activeCtrl){
    const prev=$('rp-'+activeCtrl);
    if(prev){prev.classList.remove('on');updatePillLabel(activeCtrl);}
    if(activeRow)activeRow.querySelectorAll('.rp').forEach(c=>c.classList.remove('absorbed'));
    activeCtrl=null;activeRow=null;
  }
}

// ══ INIT ══
buildTube();
updateAllPillLabels();
</script>
